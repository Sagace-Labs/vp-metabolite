[project]
name = "vp-metabolite"
version = "1.0.0"
description = "Rank candidate xenobiotic metabolite structures from a parent SMILES."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Sagace Labs" }]
keywords = ["metabolite", "xenobiotic metabolism", "cheminformatics", "ADME"]
dependencies = ["vp-core>=1.7,<2", "numpy>=1.26", "pandas>=2.2", "rdkit>=2024.3.1", "scikit-learn>=1.4", "joblib>=1.3"]

[project.urls]
Source = "https://github.com/Sagace-Labs/vp-metabolite"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vp_metabolite"]
artifacts = ["src/vp_metabolite/versions/**", "src/vp_metabolite/resources/**"]

[tool.hatch.build.targets.wheel.force-include]
"LICENSE-DATA" = "vp_metabolite/LICENSE-DATA"
"CITATION.cff" = "vp_metabolite/CITATION.cff"
